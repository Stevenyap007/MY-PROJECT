# ---------- Local broker ----------
listener 1883
listener 9001
protocol websockets
# No passwords: fine for a local demo, add them before exposing this anywhere
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# ---------- Bridge to the public broker (where the Wokwi ESP32 connects) ----------
# Copies your device's topics both ways:
#   ESP32 -> HiveMQ -> this local broker   (sensor data, states)
#   hub   -> this local broker -> HiveMQ -> ESP32   (commands)
connection hivemq-bridge
address broker.hivemq.com:1883
# >>> CHANGE BOTH "yourname" BELOW to the same value as BASE in main.cpp <<<
topic Claude-iotsim/# both 1
remote_clientid Claude-iotsim-local-bridge
try_private false
notifications false
cleansession true
start_type automatic
restart_timeout 5 30
